<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXH Catalog</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff5722;
            --beatport-color: #00e5ff;
            --text-color: #e0e0e0;
            --border-color: #333;
            --input-bg: #2a2a2a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #fff;
            margin: 0 0 15px 0;
            font-size: 1.8em;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 180px;
        }

        label {
            font-size: 0.9em;
            color: #aaa;
        }

        input, select {
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .btn-reset {
            padding: 10px 16px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            height: 41px;
        }

        .btn-reset:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #555;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #aaa;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stats span strong {
            color: var(--accent-color);
        }

        /* --- STYLE TYPE BEATPORT TRACKLIST --- */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2em;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--border-color);
        }

        .track-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 15px;
            transition: background 0.2s, border-color 0.2s;
            gap: 15px;
        }

        .track-card:hover {
            background: #252525;
            border-color: #555;
        }

        .track-main {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-grow: 1;
            min-width: 0;
        }

        .track-num {
            font-weight: bold;
            color: #777;
            width: 25px;
            text-align: right;
            flex-shrink: 0;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
            flex-grow: 1;
        }

        .track-title-mix {
            font-weight: 600;
            color: #fff;
            font-size: 1.05em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            color: #aaa;
            font-size: 0.95em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .track-meta {
            display: flex;
            gap: 10px;
            color: #888;
            font-size: 0.85em;
            align-items: center;
            flex-shrink: 0;
        }

        .meta-tag {
            background: #252525;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Session cliquable */
        .meta-tag-clickable {
            background: #252525;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .meta-tag-clickable:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(255, 87, 34, 0.1);
        }

        .yt-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-color);
            font-weight: 600;
            text-decoration: none;
            background: rgba(255, 87, 34, 0.1);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 87, 34, 0.3);
            transition: background 0.2s;
        }

        .yt-link:hover {
            background: rgba(255, 87, 34, 0.25);
        }

        .bp-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--beatport-color);
            font-weight: 600;
            text-decoration: none;
            background: rgba(0, 229, 255, 0.1);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            transition: background 0.2s;
        }

        .bp-link:hover {
            background: rgba(0, 229, 255, 0.25);
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .control-group {
                min-width: 100%;
            }
            .btn-reset {
                width: 100%;
            }
            .track-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .results-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .track-actions {
                width: 100%;
                justify-content: space-between;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <h1>🎧 MXH Sessions Catalog - (ver. 0.8)</h1>

    <!-- BARRE DE RECHERCHE ET FILTRES -->
    <div class="controls">
        <div class="control-group">
            <label for="search-artist">Search by Artist / Title:</label>
            <input type="text" id="search-artist" placeholder="Ex: Frank Klassen, Fading...">
        </div>
        <div class="control-group">
            <label for="select-mix">Sessions selection:</label>
            <select id="select-mix">
                <option value="">-- All sessions --</option>
            </select>
        </div>
        <div class="control-group">
            <label for="select-genre">Genre:</label>
            <select id="select-genre">
                <option value="">-- All genres --</option>
            </select>
        </div>
        <div class="control-group">
            <label for="select-year">Year:</label>
            <select id="select-year">
                <option value="">-- All years --</option>
            </select>
        </div>
        <button class="btn-reset" onclick="resetFilters()">Reset</button>
    </div>

    <!-- ZONE DE STATISTIQUES GLOBALES -->
    <div class="stats">
        <div id="catalog-global-stats">Global: Chargement...</div>
        <div id="record-count">Sélectionnez un filtre ou lancez une recherche pour afficher les pistes</div>
    </div>

    <!-- CONTENEUR DES RÉSULTATS -->
    <div id="results-container" class="results-container">
        <div class="no-results">Aucun filtre actif. Veuillez utiliser la recherche ou sélectionner une session, un genre ou une année.</div>
    </div>

    <script>
        let allData = [];

        async function initCatalog() {
            try {
                const response = await fetch('mixes.csv');
                if (!response.ok) throw new Error("Fichier introuvable");
                
                const buffer = await response.arrayBuffer();
                const decoder = new TextDecoder('iso-8859-1');
                const text = decoder.decode(buffer);

                allData = parseCSV(text);

                allData.sort((a, b) => {
                    let mixA = a.id_mix || '';
                    let mixB = b.id_mix || '';
                    if (mixA !== mixB) {
                        return mixB.localeCompare(mixA, undefined, { numeric: true, sensitivity: 'base' });
                    }
                    let numA = parseInt(a.id_title, 10) || 0;
                    let numB = parseInt(b.id_title, 10) || 0;
                    return numA - numB;
                });

                populateGlobalStats();
                updateSelectOptions(allData);

                document.getElementById('search-artist').addEventListener('input', applyFilters);
                document.getElementById('select-mix').addEventListener('change', applyFilters);
                document.getElementById('select-genre').addEventListener('change', applyFilters);
                document.getElementById('select-year').addEventListener('change', applyFilters);

            } catch (err) {
                console.error("Erreur lors du chargement de mixes.csv :", err);
                document.getElementById('record-count').textContent = "Erreur de chargement. Vérifiez votre serveur local HTTP.";
            }
        }

        function populateGlobalStats() {
            const totalMixes = new Set(allData.map(d => d.id_mix).filter(Boolean)).size;
            const uniqueTracks = new Set(allData.map(d => `${d.artist}|${d.title}`).filter(x => x !== '|')).size;
            document.getElementById('catalog-global-stats').innerHTML = `Total Mixes: <strong>${totalMixes}</strong> | Unique Tracks: <strong>${uniqueTracks}</strong>`;
        }

        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length === 0) return [];
            const headers = parseCSVLine(lines[0]);
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                if (values.length >= headers.length) {
                    let entry = {};
                    headers.forEach((h, index) => {
                        entry[h.trim()] = values[index] ? values[index].trim() : '';
                    });
                    data.push(entry);
                }
            }
            return data;
        }

        function parseCSVLine(text) {
            let result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ';' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result.map(val => val.trim().replace(/^"(.*)"$/, '$1').replace(/""/g, '"'));
        }

        function updateSelectOptions(currentFilteredData) {
            const mixSelect = document.getElementById('select-mix');
            const genreSelect = document.getElementById('select-genre');
            const yearSelect = document.getElementById('select-year');

            const currentMix = mixSelect.value;
            const currentGenre = genreSelect.value;
            const currentYear = yearSelect.value;

            const mixes = [...new Set(currentFilteredData.map(d => d.id_mix || d.mix_name).filter(Boolean))].sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
            const genres = [...new Set(currentFilteredData.map(d => d.genre).filter(Boolean))].sort();
            const years = [...new Set(currentFilteredData.map(d => d.year).filter(Boolean))].sort((a, b) => b - a);

            mixSelect.innerHTML = '<option value="">-- All sessions --</option>';
            mixes.forEach(mix => {
                const opt = document.createElement('option');
                opt.value = mix; opt.textContent = mix;
                if (mix === currentMix) opt.selected = true;
                mixSelect.appendChild(opt);
            });

            genreSelect.innerHTML = '<option value="">-- All genres --</option>';
            genres.forEach(genre => {
                const opt = document.createElement('option');
                opt.value = genre; opt.textContent = genre;
                if (genre === currentGenre) opt.selected = true;
                genreSelect.appendChild(opt);
            });

            yearSelect.innerHTML = '<option value="">-- All years --</option>';
            years.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year; opt.textContent = year;
                if (year === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            });
        }

        // Fonction pour activer directement le filtre d'une session donnée
        function selectSession(sessionName) {
            // Réinitialise la recherche texte pour voir l'intégralité de la session
            document.getElementById('search-artist').value = '';
            document.getElementById('select-mix').value = sessionName;
            document.getElementById('select-genre').value = '';
            document.getElementById('select-year').value = '';
            applyFilters();
        }

        function applyFilters() {
            const searchValue = document.getElementById('search-artist').value.toLowerCase().trim();
            const selectedMix = document.getElementById('select-mix').value;
            const selectedGenre = document.getElementById('select-genre').value;
            const selectedYear = document.getElementById('select-year').value;

            const container = document.getElementById('results-container');
            const countDiv = document.getElementById('record-count');

            if (!searchValue && !selectedMix && !selectedGenre && !selectedYear) {
                container.innerHTML = '<div class="no-results">Aucun filtre actif. Veuillez utiliser la recherche ou sélectionner une session, un genre ou une année.</div>';
                countDiv.textContent = 'Sélectionnez un filtre ou lancez une recherche pour afficher les pistes';
                updateSelectOptions(allData);
                return;
            }

            const filtered = allData.filter(item => {
                const matchesSearch = !searchValue || 
                                      (item.artist || '').toLowerCase().includes(searchValue) ||
                                      (item.title || '').toLowerCase().includes(searchValue) ||
                                      (item.youtube_title || '').toLowerCase().includes(searchValue);

                const matchesMix = !selectedMix || item.id_mix === selectedMix || item.mix_name === selectedMix;
                const matchesGenre = !selectedGenre || item.genre === selectedGenre;
                const matchesYear = !selectedYear || item.year === selectedYear;

                return matchesSearch && matchesMix && matchesGenre && matchesYear;
            });

            const filteredByMix = allData.filter(item => {
                const s = !searchValue || (item.artist || '').toLowerCase().includes(searchValue) || (item.title || '').toLowerCase().includes(searchValue) || (item.youtube_title || '').toLowerCase().includes(searchValue);
                const g = !selectedGenre || item.genre === selectedGenre;
                const y = !selectedYear || item.year === selectedYear;
                return s && g && y;
            });

            const filteredByGenre = allData.filter(item => {
                const s = !searchValue || (item.artist || '').toLowerCase().includes(searchValue) || (item.title || '').toLowerCase().includes(searchValue) || (item.youtube_title || '').toLowerCase().includes(searchValue);
                const m = !selectedMix || item.id_mix === selectedMix || item.mix_name === selectedMix;
                const y = !selectedYear || item.year === selectedYear;
                return s && m && y;
            });

            const filteredByYear = allData.filter(item => {
                const s = !searchValue || (item.artist || '').toLowerCase().includes(searchValue) || (item.title || '').toLowerCase().includes(searchValue) || (item.youtube_title || '').toLowerCase().includes(searchValue);
                const m = !selectedMix || item.id_mix === selectedMix || item.mix_name === selectedMix;
                const g = !selectedGenre || item.genre === selectedGenre;
                return s && m && g;
            });

            updateSpecificSelects(filteredByMix, filteredByGenre, filteredByYear);
            renderResults(filtered, { selectedMix, selectedGenre, selectedYear, searchValue });
        }

        function updateSpecificSelects(dataForMix, dataForGenre, dataForYear) {
            const mixSelect = document.getElementById('select-mix');
            const genreSelect = document.getElementById('select-genre');
            const yearSelect = document.getElementById('select-year');

            const currentMix = mixSelect.value;
            const currentGenre = genreSelect.value;
            const currentYear = yearSelect.value;

            const mixes = [...new Set(dataForMix.map(d => d.id_mix || d.mix_name).filter(Boolean))].sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
            mixSelect.innerHTML = '<option value="">-- All sessions --</option>';
            mixes.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.textContent = m;
                if (m === currentMix) opt.selected = true;
                mixSelect.appendChild(opt);
            });

            const genres = [...new Set(dataForGenre.map(d => d.genre).filter(Boolean))].sort();
            genreSelect.innerHTML = '<option value="">-- All genres --</option>';
            genres.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g; opt.textContent = g;
                if (g === currentGenre) opt.selected = true;
                genreSelect.appendChild(opt);
            });

            const years = [...new Set(dataForYear.map(d => d.year).filter(Boolean))].sort((a, b) => b - a);
            yearSelect.innerHTML = '<option value="">-- All years --</option>';
            years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y; opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            });
        }

        function resetFilters() {
            document.getElementById('search-artist').value = '';
            document.getElementById('select-mix').value = '';
            document.getElementById('select-genre').value = '';
            document.getElementById('select-year').value = '';
            
            updateSelectOptions(allData);
            document.getElementById('results-container').innerHTML = '<div class="no-results">Aucun filtre actif. Veuillez utiliser la recherche ou sélectionner une session, un genre ou une année.</div>';
            document.getElementById('record-count').textContent = 'Sélectionnez un filtre ou lancez une recherche pour afficher les pistes';
        }

        function renderResults(data, filters) {
            const container = document.getElementById('results-container');
            const countDiv = document.getElementById('record-count');
            container.innerHTML = '';

            countDiv.textContent = `${data.length} track(s) found`;

            if (data.length === 0) {
                container.innerHTML = '<div class="no-results">Aucun morceau ne correspond à vos critères.</div>';
                return;
            }

            let headerTitle = "Résultats de la sélection";
            if (filters.selectedMix) headerTitle = `Session : ${filters.selectedMix}`;
            else if (filters.selectedGenre) headerTitle = `Genre : ${filters.selectedGenre}`;
            else if (filters.selectedYear) headerTitle = `Année : ${filters.selectedYear}`;
            else if (filters.searchValue) headerTitle = `Recherche : "${filters.searchValue}"`;

            const headerEl = document.createElement('div');
            headerEl.className = 'results-header';
            
            let headerYouTubeHTML = '';
            if (filters.selectedMix) {
                const firstWithUrl = data.find(i => i.url_id && i.url_id.trim() !== '');
                if (firstWithUrl) {
                    headerYouTubeHTML = `<a href="https://www.youtube.com/watch?v=${encodeURIComponent(firstWithUrl.url_id.trim())}" target="_blank" class="yt-link" style="font-size: 0.85em; padding: 4px 10px;">▶ Play Session on YouTube</a>`;
                }
            }

            headerEl.innerHTML = `<span>${headerTitle} (${data.length})</span>${headerYouTubeHTML}`;
            container.appendChild(headerEl);

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'track-card';

                const beatportQuery = encodeURIComponent(`${item.artist || ''} ${item.title || ''}`.trim());
                const beatportLinkHTML = `<a href="https://www.beatport.com/search?q=${beatportQuery}" target="_blank" class="bp-link">▶ Play on Beatport</a>`;

                let actionsHTML = '';
                if (filters.selectedMix) {
                    actionsHTML = beatportLinkHTML;
                } else {
                    let youtubeLinkHTML = '<span style="color:#555; font-style:italic;">-</span>';
                    if (item.url_id && item.url_id.trim() !== '') {
                        youtubeLinkHTML = `<a href="https://www.youtube.com/watch?v=${encodeURIComponent(item.url_id.trim())}" target="_blank" class="yt-link">▶ Play on YouTube</a>`;
                    }
                    actionsHTML = `${youtubeLinkHTML} ${beatportLinkHTML}`;
                }

                const trackTitle = item.title || 'Titre inconnu';
                const mixName = item.mix_name ? ` (${item.mix_name})` : '';
                const displayTitleMix = `${trackTitle}${mixName}`;
                const displayArtist = item.artist || 'Artiste inconnu';

                let metaTagsHTML = '';
                // Badge de Session cliquable uniquement si on n'est pas déjà en mode sélection de session
                if (!filters.selectedMix && item.id_mix) {
                    const sessionVal = item.id_mix;
                    metaTagsHTML += `<span class="meta-tag-clickable" onclick="selectSession('${sessionVal}')" title="Filtrer sur cette session">Session: ${sessionVal}</span>`;
                }
                if (!filters.selectedGenre && item.genre) {
                    metaTagsHTML += `<span class="meta-tag">${item.genre}</span>`;
                }
                if (!filters.selectedYear && item.year) {
                    metaTagsHTML += `<span class="meta-tag">${item.year}</span>`;
                }

                card.innerHTML = `
                    <div class="track-main">
                        <div class="track-num">${item.id_title || (index + 1)}</div>
                        <div class="track-info">
                            <div class="track-title-mix">${displayTitleMix}</div>
                            <div class="track-artist">${displayArtist}</div>
                        </div>
                    </div>
                    <div class="track-actions">
                        <div class="track-meta">
                            ${metaTagsHTML}
                        </div>
                        ${actionsHTML}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = initCatalog;
    </script>
</body>
</html>
