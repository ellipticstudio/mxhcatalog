<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXH Catalog</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff5722;
            --text-color: #e0e0e0;
            --border-color: #333;
            --input-bg: #2a2a2a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 200px;
        }

        label {
            font-size: 0.9em;
            color: #aaa;
        }

        input, select {
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.95em;
            color: #aaa;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stats span strong {
            color: var(--accent-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #252525;
            color: var(--accent-color);
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background-color: #2c2c2c;
        }

        tr:hover {
            background-color: #282828;
        }

        .yt-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #ff0000;
            font-weight: bold;
            text-decoration: none;
            background: rgba(255, 0, 0, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 0, 0, 0.3);
            transition: background 0.2s;
        }

        .yt-link:hover {
            background: rgba(255, 0, 0, 0.25);
            text-decoration: none;
        }

        .no-link {
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>🎧 MXH Sessions Catalog - (ver. 0.1)</h1>

    <!-- BARRE DE RECHERCHE ET FILTRES -->
    <div class="controls">
        <div class="control-group">
            <label for="search-artist">Search by Artist / Title:</label>
            <input type="text" id="search-artist" placeholder="Ex: Frank Klassen, Fading...">
        </div>
        <div class="control-group">
            <label for="select-mix">Sessions selection:</label>
            <select id="select-mix">
                <option value="">-- All sessions --</option>
            </select>
        </div>
        <div class="control-group">
            <label for="select-genre">Genre:</label>
            <select id="select-genre">
                <option value="">-- All genres --</option>
            </select>
        </div>
    </div>

    <!-- ZONE DE STATISTIQUES GLOBALes ET FILTRÉES -->
    <div class="stats">
        <div id="catalog-global-stats">Global: Chargement...</div>
        <div id="record-count">Filtered: Chargement...</div>
    </div>

    <table id="catalog-table">
        <thead>
            <tr>
                <th onclick="sortTable(0)">ID Session ⇕</th>
                <th onclick="sortTable(1)">N° ⇕</th>
                <th onclick="sortTable(2)">Artist ⇕</th>
                <th onclick="sortTable(3)">Title ⇕</th>
                <th onclick="sortTable(4)">Mix name ⇕</th>
                <th onclick="sortTable(5)">Genre ⇕</th>
                <th onclick="sortTable(6)">YouTube title ⇕</th>
                <th> YouTube link</th>
            </tr>
        </thead>
        <tbody>
            <!-- Lignes générées dynamiquement -->
        </tbody>
    </table>

    <script>
        let allData = [];

        async function initCatalog() {
            try {
                const response = await fetch('mixes.csv');
                const buffer = await response.arrayBuffer();
                const decoder = new TextDecoder('iso-8859-1');
                const text = decoder.decode(buffer);

                allData = parseCSV(text);

                populateGlobalStats();
                populateSelectFilters();
                renderTable(allData);

                document.getElementById('search-artist').addEventListener('input', applyFilters);
                document.getElementById('select-mix').addEventListener('change', applyFilters);
                document.getElementById('select-genre').addEventListener('change', applyFilters);

            } catch (err) {
                console.error("Erreur lors du chargement de mixes.csv :", err);
                document.getElementById('record-count').textContent = "Erreur de chargement du fichier CSV (Vérifiez la console).";
            }
        }

        function populateGlobalStats() {
            const totalMixes = new Set(allData.map(d => d.id_mix).filter(Boolean)).size;
            const uniqueTracks = new Set(allData.map(d => `${d.artist}|${d.title}`).filter(x => x !== '|')).size;
            
            const globalStatsDiv = document.getElementById('catalog-global-stats');
            globalStatsDiv.innerHTML = `Total Mixes: <strong>${totalMixes}</strong> | Unique Tracks: <strong>${uniqueTracks}</strong>`;
        }

        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length === 0) return [];

            const headers = parseCSVLine(lines[0]);
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                if (values.length >= headers.length) {
                    let entry = {};
                    headers.forEach((h, index) => {
                        entry[h.trim()] = values[index] ? values[index].trim() : '';
                    });
                    data.push(entry);
                }
            }
            return data;
        }

        function parseCSVLine(text) {
            let result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ';' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result.map(val => val.replace(/^"|"$/g, ''));
        }

        function populateSelectFilters() {
            const mixSelect = document.getElementById('select-mix');
            const genreSelect = document.getElementById('select-genre');

            const mixes = [...new Set(allData.map(d => d.id_mix || d.mix_name).filter(Boolean))].sort();
            const genres = [...new Set(allData.map(d => d.genre).filter(Boolean))].sort();

            mixes.forEach(mix => {
                const opt = document.createElement('option');
                opt.value = mix;
                opt.textContent = mix;
                mixSelect.appendChild(opt);
            });

            genres.forEach(genre => {
                const opt = document.createElement('option');
                opt.value = genre;
                opt.textContent = genre;
                genreSelect.appendChild(opt);
            });
        }

        function applyFilters() {
            const searchValue = document.getElementById('search-artist').value.toLowerCase();
            const selectedMix = document.getElementById('select-mix').value;
            const selectedGenre = document.getElementById('select-genre').value;

            const filtered = allData.filter(item => {
                const matchesSearch = (item.artist || '').toLowerCase().includes(searchValue) ||
                                      (item.title || '').toLowerCase().includes(searchValue) ||
                                      (item.youtube_title || '').toLowerCase().includes(searchValue);

                const matchesMix = !selectedMix || item.id_mix === selectedMix || item.mix_name === selectedMix;
                const matchesGenre = !selectedGenre || item.genre === selectedGenre;

                return matchesSearch && matchesMix && matchesGenre;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.querySelector('#catalog-table tbody');
            const countDiv = document.getElementById('record-count');
            tbody.innerHTML = '';

            countDiv.textContent = `${data.length} row(s) displayed`;

            data.forEach(item => {
                const tr = document.createElement('tr');

                let youtubeLinkHTML = '<span class="no-link">-</span>';
                if (item.url_id && item.url_id.trim() !== '') {
                    youtubeLinkHTML = `<a href="https://www.youtube.com/watch?v=${encodeURIComponent(item.url_id.trim())}" target="_blank" class="yt-link">▶ Voir</a>`;
                }

                tr.innerHTML = `
                    <td><strong>${item.id_mix || ''}</strong></td>
                    <td>${item.id_title || ''}</td>
                    <td>${item.artist || ''}</td>
                    <td>${item.title || ''}</td>
                    <td>${item.mix_name || ''}</td>
                    <td>${item.genre || ''}</td>
                    <td>${item.youtube_title || ''}</td>
                    <td>${youtubeLinkHTML}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        let sortDirection = false;
        function sortTable(columnIndex) {
            const keys = ['id_mix', 'id_title', 'artist', 'title', 'mix_name', 'genre', 'youtube_title'];
            const key = keys[columnIndex];

            sortDirection = !sortDirection;
            allData.sort((a, b) => {
                let valA = a[key] || '';
                let valB = b[key] || '';

                if (!isNaN(valA) && !isNaN(valB) && valA !== '' && valB !== '') {
                    return sortDirection ? valA - valB : valB - valA;
                }
                return sortDirection ? valA.localeCompare(valB) : valB.localeCompare(valA);
            });

            applyFilters();
        }

        window.onload = initCatalog;
    </script>
</body>
</html>
