<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Catalogue MXH Mixes House</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #121212; color: #e0e0e0; }
        h1 { color: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { padding: 12px; border: 1px solid #333; text-align: left; }
        th { background-color: #2a2a2a; color: #ff5722; }
        tr:hover { background-color: #252525; }
        a { color: #4fc3f7; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Catalogue des Mixes MXH</h1>
    <table id="catalog-table">
        <thead>
            <tr>
                <th>ID Mix</th>
                <th>Artiste</th>
                <th>Titre</th>
                <th>Nom du Mix</th>
                <th>Genre</th>
                <th>Titre YouTube</th>
                <th>Lien YouTube</th>
            </tr>
        </thead>
        <tbody>
            <!-- Les lignes seront insérées dynamiquement ici -->
        </tbody>
    </table>

    <script>
        // Fonction simple pour parser le CSV et remplir le tableau
        async function loadCSV() {
            try {
                const response = await fetch('mixes.csv');
                const data = await response.text();
                const lines = data.split('\n').filter(line => line.trim() !== '');
                
                const tbody = document.querySelector('#catalog-table tbody');
                tbody.innerHTML = '';

                // On saute l'en-tête (i = 1)
                for (let i = 1; i < lines.length; i++) {
                    // Gestion basique du CSV avec séparateur point-virgule
                    const row = lines[i];
                    // (Optionnel : parser les guillemets si nécessaire, ou découper simplement)
                    const cols = parseCSVLine(row);
                    
                    if (cols.length >= 8) {
                        const [id_mix, id_title, artist, title, mix_name, genre, url_id, youtube_title] = cols;
                        
                        const tr = document.createElement('tr');
                        
                        let youtubeLinkHTML = '-';
                        if (url_id && url_id.trim() !== '') {
                            youtubeLinkHTML = `<a href="https://www.youtube.com/watch?v=${url_id.trim()}" target="_blank">🔗 Voir sur YouTube</a>`;
                        }

                        tr.innerHTML = `
                            <td>${id_mix || ''}</td>
                            <td>${artist || ''}</td>
                            <td>${title || ''}</td>
                            <td>${mix_name || ''}</td>
                            <td>${genre || ''}</td>
                            <td>${youtube_title || ''}</td>
                            <td>${youtubeLinkHTML}</td>
                        `;
                        tbody.appendChild(tr);
                    }
                }
            } catch (error) {
                console.error("Erreur lors du chargement du fichier CSV :", error);
            }
        }

        // Utilitaire pour parser une ligne CSV gérant les guillemets
        function parseCSVLine(text) {
            let result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ';' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result.map(val => val.replace(/^"|"$/g, ''));
        }

        loadCSV();
    </script>
</body>
</html>
