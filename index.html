<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXH - Mix Catalog & Tracklists</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background-color: #1f1f1f;
            border-bottom: 1px solid #333;
        }
        .card-custom {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
        }
        .form-control, .form-select {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #333;
            color: #fff;
            border-color: #0d6efd;
            box-shadow: none;
        }
        .track-number {
            font-weight: bold;
            color: #0d6efd;
            width: 35px;
        }
        .artist-name {
            color: #fff;
            font-weight: 600;
        }
        .track-title {
            color: #aaa;
        }
        .mix-version {
            color: #777;
            font-style: italic;
            font-size: 0.9em;
        }
        .badge-genre {
            background-color: #2c3e50;
            color: #17a2b8;
            font-size: 0.8em;
        }
        .badge-mix {
            background-color: #0d6efd;
            color: #fff;
            cursor: pointer;
        }
        .nav-tabs .nav-link {
            color: #aaa;
            border: none;
        }
        .nav-tabs .nav-link.active {
            background-color: transparent;
            color: #0d6efd;
            border-bottom: 2px solid #0d6efd;
            font-weight: bold;
        }
        .list-group-item {
            background-color: #242424;
            border-color: #333;
            color: #e0e0e0;
        }
        .status-badge {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-compact-disc me-2 text-primary"></i>MXH Catalog</a>
            <span class="badge bg-secondary status-badge" id="status-badge"><i class="fa-solid fa-spinner fa-spin me-1"></i>Chargement...</span>
        </div>
    </nav>

    <div class="container my-4">

        <!-- Nav tabs -->
        <ul class="nav nav-tabs mb-4" id="mainTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="mixes-tab" data-bs-toggle="tab" data-bs-target="#mixes-pane" type="button" role="tab"><i class="fa-solid fa-list-ol me-2"></i>All Tracklists</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="artist-tab" data-bs-toggle="tab" data-bs-target="#artist-pane" type="button" role="tab"><i class="fa-solid fa-user-check me-2"></i>Search by Artist</button>
            </li>
        </ul>

        <div class="tab-content" id="mainTabContent">

            <!-- TAB 1: PAR MIX -->
            <div class="tab-pane fade show active" id="mixes-pane" role="tabpanel">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card card-custom p-3">
                            <label for="select-mix" class="form-label fw-bold"><i class="fa-solid fa-sliders me-2"></i>Sélectionner un Mix :</label>
                            <input type="text" class="form-control mb-2" id="search-mix-input" placeholder="Filtrer la liste...">
                            <select class="form-select" id="select-mix" size="15">
                                <option value="" disabled>Chargement des données...</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card card-custom p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom border-secondary pb-2">
                                <h4 id="mix-title-display" class="m-0 text-primary">Sélectionnez un mix</h4>
                                <button class="btn btn-outline-light btn-sm" id="btn-copy" onclick="copyTracklist()"><i class="fa-regular fa-copy me-1"></i>Copy tracklist</button>
                            </div>
                            <div id="tracklist-container">
                                <p class="text-muted">Veuillez choisir un mix dans le menu de gauche pour afficher les morceaux.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 2: PAR ARTISTE -->
            <div class="tab-pane fade" id="artist-pane" role="tabpanel">
                <div class="card card-custom p-4 mb-4">
                    <label for="search-artist-input" class="form-label fw-bold"><i class="fa-solid fa-magnifying-glass me-2"></i>Rechercher un Artiste :</label>
                    <input type="text" class="form-control form-control-lg" id="search-artist-input" placeholder="Ex: Guy J, CamelPhat, Silver Panda...">
                </div>

                <div class="card card-custom p-4">
                    <h4 class="text-primary mb-3" id="artist-results-title">Résultats</h4>
                    <div id="artist-results-container">
                        <p class="text-muted">Tapez un nom d'artiste pour faire apparaître tous les mixes dans lesquels il figure.</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        let allData = [];
        let mixMap = {};

        // Chargement automatique du CSV au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            fetch('./mixes.csv')
                .then(response => {
                    if (!response.ok) throw new Error("Fichier mixes.csv introuvable.");
                    return response.text();
                })
                .then(csvText => {
                    parseCSV(csvText);
                    document.getElementById('status-badge').className = "badge bg-success status-badge";
                    document.getElementById('status-badge').innerHTML = `<i class="fa-solid fa-check me-1"></i>Database loaded (${Object.keys(mixMap).length} mixes)`;
                })
                .catch(err => {
                    document.getElementById('status-badge').className = "badge bg-danger status-badge";
                    document.getElementById('status-badge').innerHTML = `<i class="fa-solid fa-triangle-exclamation me-1"></i>Erreur CSV`;
                    console.error(err);
                });
        });

        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            allData = [];
            mixMap = {};

            lines.forEach((line, lineIdx) => {
                if (!line.trim() || lineIdx === 0) return; // Ignorer les lignes vides et l'en-tête
                const cols = line.split(';');
                if (cols.length < 3) return;

                const id = cols[0].trim();
                const artist = cols[1].trim();
                const title = cols[2].trim();
                const mix_name = cols[3] ? cols[3].trim() : '';
                const genre = cols[4] ? cols[4].trim() : '';

                if (!mixMap[id]) {
                    mixMap[id] = [];
                }

                mixMap[id].push({
                    no: mixMap[id].length + 1,
                    artist: artist,
                    title: title,
                    mix_name: mix_name,
                    genre: genre
                });
            });

            populateMixSelect();
        }

        function populateMixSelect(filterText = '') {
            const select = document.getElementById('select-mix');
            select.innerHTML = '';

            const keys = Object.keys(mixMap);
            const filteredKeys = keys.filter(k => k.toLowerCase().includes(filterText.toLowerCase()));

            if (filteredKeys.length === 0) {
                select.innerHTML = '<option value="" disabled>Aucun mix trouvé</option>';
                return;
            }

            filteredKeys.forEach(id => {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = `${id} (${mixMap[id].length} titres)`;
                select.appendChild(option);
            });

            select.onchange = (e) => displayTracklist(e.target.value);
            
            // Sélectionner le premier mix par défaut s'il y en a un
            if (filteredKeys.length > 0) {
                select.value = filteredKeys[0];
                displayTracklist(filteredKeys[0]);
            }
        }

        document.getElementById('search-mix-input').addEventListener('input', (e) => {
            populateMixSelect(e.target.value);
        });

        function displayTracklist(mixId) {
            const container = document.getElementById('tracklist-container');
            const titleDisplay = document.getElementById('mix-title-display');
            const tracks = mixMap[mixId];

            if (!tracks) return;

            titleDisplay.textContent = `Mix : ${mixId}`;
            container.innerHTML = '';

            const list = document.createElement('div');
            list.className = 'list-group list-group-flush';

            tracks.forEach(t => {
                const item = document.createElement('div');
                item.className = 'list-group-item d-flex align-items-center justify-content-between py-2';
                
                const version = t.mix_name ? `<span class="mix-version">(${t.mix_name})</span>` : '';
                const genreBadge = t.genre ? `<span class="badge badge-genre ms-2">${t.genre}</span>` : '';

                item.innerHTML = `
                    <div class="d-flex align-items-center">
                        <span class="track-number">#${t.no}</span>
                        <div>
                            <span class="artist-name">${t.artist}</span> - 
                            <span class="track-title">${t.title}</span> ${version}
                        </div>
                    </div>
                    <div>${genreBadge}</div>
                `;
                list.appendChild(item);
            });

            container.appendChild(list);
        }

        // Recherche par artiste
        document.getElementById('search-artist-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const container = document.getElementById('artist-results-container');
            const titleDisplay = document.getElementById('artist-results-title');

            if (!query) {
                titleDisplay.textContent = 'Résultats';
                container.innerHTML = '<p class="text-muted">Tapez un nom d\'artiste pour faire apparaître tous les mixes dans lesquels il figure.</p>';
                return;
            }

            let matchCount = 0;
            const results = [];

            Object.keys(mixMap).forEach(mixId => {
                mixMap[mixId].forEach(t => {
                    if (t.artist.toLowerCase().includes(query)) {
                        results.push({ mixId: mixId, track: t });
                        matchCount++;
                    }
                });
            });

            titleDisplay.textContent = `Résultats pour "${query}" (${matchCount} occurrences)`;
            container.innerHTML = '';

            if (results.length === 0) {
                container.innerHTML = '<p class="text-warning">Aucun artiste trouvé correspondant à cette recherche.</p>';
                return;
            }

            const list = document.createElement('div');
            list.className = 'list-group list-group-flush';

            results.forEach(res => {
                const item = document.createElement('div');
                item.className = 'list-group-item d-flex align-items-center justify-content-between py-2';
                const version = res.track.mix_name ? `<span class="mix-version">(${res.track.mix_name})</span>` : '';

                item.innerHTML = `
                    <div>
                        <span class="badge badge-mix me-2" onclick="switchToMix('${res.mixId}')">${res.mixId}</span>
                        <span class="track-number">#${res.track.no}</span>
                        <span class="artist-name">${res.track.artist}</span> - 
                        <span class="track-title">${res.track.title}</span> ${version}
                    </div>
                `;
                list.appendChild(item);
            });

            container.appendChild(list);
        });

        function switchToMix(mixId) {
            const tabBtn = document.getElementById('mixes-tab');
            const tab = new bootstrap.Tab(tabBtn);
            tab.show();

            const select = document.getElementById('select-mix');
            select.value = mixId;
            displayTracklist(mixId);
        }

        function copyTracklist() {
            const select = document.getElementById('select-mix');
            const mixId = select.value;
            if (!mixId || !mixMap[mixId]) return;

            let textToCopy = `Tracklist ${mixId} :\n`;
            mixMap[mixId].forEach(t => {
                const version = t.mix_name ? ` (${t.mix_name})` : '';
                textToCopy += `${t.no}. ${t.artist} - ${t.title}${version}\n`;
            });

            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.getElementById('btn-copy');
                btn.innerHTML = '<i class="fa-solid fa-check me-1"></i>Copié !';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-regular fa-copy me-1"></i>Copier la tracklist';
                }, 2000);
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
