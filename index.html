<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXH Catalog</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff5722;
            --text-color: #e0e0e0;
            --border-color: #333;
            --input-bg: #2a2a2a;
        }

        /* --- STYLES DESKTOP (Par défaut) --- */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #fff;
            margin: 0 0 15px 0;
            padding: 0;
            flex-shrink: 0;
            font-size: 1.8em;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 180px;
        }

        label {
            font-size: 0.9em;
            color: #aaa;
        }

        input, select {
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .btn-reset {
            padding: 10px 16px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            height: 41px;
        }

        .btn-reset:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #555;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.95em;
            color: #aaa;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .stats span strong {
            color: var(--accent-color);
        }

        .table-container {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: auto; /* Permet le défilement horizontal du tableau sur mobile */
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap; /* Évite les retours à la ligne intempestifs */
        }

        th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #252525;
            color: var(--accent-color);
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 2px 2px rgba(0,0,0,0.2);
        }

        th:hover {
            background-color: #2c2c2c;
        }

        tr:hover {
            background-color: #282828;
        }

        .yt-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #ff5722;
            font-weight: 600;
            text-decoration: none;
            background: rgba(255, 87, 34, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 87, 34, 0.3);
            transition: background 0.2s;
        }

        .yt-link:hover {
            background: rgba(255, 87, 34, 0.25);
            text-decoration: none;
        }

        .no-link {
            color: #555;
            font-style: italic;
        }

        /* --- ADAPTATION MOBILITY / SMARTPHONE --- */
        @media (max-width: 768px) {
            html, body {
                height: auto;
                overflow: visible; /* Défilement naturel de la page */
            }

            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.4em;
                margin-bottom: 10px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                padding: 10px;
            }

            .control-group {
                min-width: 100%;
            }

            .btn-reset {
                width: 100%;
            }

            .stats {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            .table-container {
                overflow-x: auto;
                max-height: none; /* Le tableau s'allonge naturellement */
            }

            th {
                position: static; /* Désactive le sticky interne du tableau sur petit écran */
            }
        }
    </style>
</head>
<body>

    <h1>🎧 MXH Sessions Catalog - (ver. 0.2)</h1>

    <!-- BARRE DE RECHERCHE ET FILTRES -->
    <div class="controls">
        <div class="control-group">
            <label for="search-artist">Search by Artist / Title:</label>
            <input type="text" id="search-artist" placeholder="Ex: Frank Klassen, Fading...">
        </div>
        <div class="control-group">
            <label for="select-mix">Sessions selection:</label>
            <select id="select-mix">
                <option value="">-- All sessions --</option>
            </select>
        </div>
        <div class="control-group">
            <label for="select-genre">Genre:</label>
            <select id="select-genre">
                <option value="">-- All genres --</option>
            </select>
        </div>
        <div class="control-group">
            <label for="select-year">Year:</label>
            <select id="select-year">
                <option value="">-- All years --</option>
            </select>
        </div>
        <button class="btn-reset" onclick="resetFilters()">Reset</button>
    </div>

    <!-- ZONE DE STATISTIQUES GLOBALES ET FILTRÉES -->
    <div class="stats">
        <div id="catalog-global-stats">Global: Chargement...</div>
        <div id="record-count">Filtered: Chargement...</div>
    </div>

    <!-- CONTENEUR DU TABLEAU AVEC DÉFILEMENT INTERNE -->
    <div class="table-container">
        <table id="catalog-table">
            <thead>
                <tr>
                    <th onclick="sortTable(0)">ID Session ⇕</th>
                    <th onclick="sortTable(1)">N° ⇕</th>
                    <th onclick="sortTable(2)">Artist ⇕</th>
                    <th onclick="sortTable(3)">Title ⇕</th>
                    <th onclick="sortTable(4)">Mix name ⇕</th>
                    <th onclick="sortTable(5)">Genre ⇕</th>
                    <th onclick="sortTable(6)">YouTube title ⇕</th>
                    <th onclick="sortTable(7)">Year ⇕</th>
                    <th>YouTube</th>
                </tr>
            </thead>
            <tbody>
                <!-- Lignes générées dynamiquement -->
            </tbody>
        </table>
    </div>

    <script>
        let allData = [];

        async function initCatalog() {
            try {
                const response = await fetch('mixes.csv');
                if (!response.ok) throw new Error("Fichier introuvable");
                
                const buffer = await response.arrayBuffer();
                const decoder = new TextDecoder('iso-8859-1');
                const text = decoder.decode(buffer);

                allData = parseCSV(text);

                allData.sort((a, b) => {
                    let mixA = a.id_mix || '';
                    let mixB = b.id_mix || '';

                    if (mixA !== mixB) {
                        return mixB.localeCompare(mixA, undefined, { numeric: true, sensitivity: 'base' });
                    }

                    let numA = parseInt(a.id_title, 10) || 0;
                    let numB = parseInt(b.id_title, 10) || 0;
                    return numA - numB;
                });

                populateGlobalStats();
                updateSelectOptions(allData);
                renderTable(allData);

                document.getElementById('search-artist').addEventListener('input', applyFilters);
                document.getElementById('select-mix').addEventListener('change', applyFilters);
                document.getElementById('select-genre').addEventListener('change', applyFilters);
                document.getElementById('select-year').addEventListener('change', applyFilters);

            } catch (err) {
                console.error("Erreur lors du chargement de mixes.csv :", err);
                document.getElementById('record-count').textContent = "Erreur de chargement. Si vous êtes en local, lancez un serveur web local.";
            }
        }

        function populateGlobalStats() {
            const totalMixes = new Set(allData.map(d => d.id_mix).filter(Boolean)).size;
            const uniqueTracks = new Set(allData.map(d => `${d.artist}|${d.title}`).filter(x => x !== '|')).size;
            
            const globalStatsDiv = document.getElementById('catalog-global-stats');
            globalStatsDiv.innerHTML = `Total Mixes: <strong>${totalMixes}</strong> | Unique Tracks: <strong>${uniqueTracks}</strong>`;
        }

        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length === 0) return [];

            const headers = parseCSVLine(lines[0]);
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                if (values.length >= headers.length) {
                    let entry = {};
                    headers.forEach((h, index) => {
                        entry[h.trim()] = values[index] ? values[index].trim() : '';
                    });
                    data.push(entry);
                }
            }
            return data;
        }

        function parseCSVLine(text) {
            let result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ';' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result.map(val => val.replace(/^"|"$/g, ''));
        }

        function updateSelectOptions(currentFilteredData) {
            const mixSelect = document.getElementById('select-mix');
            const genreSelect = document.getElementById('select-genre');
            const yearSelect = document.getElementById('select-year');

            const currentMix = mixSelect.value;
            const currentGenre = genreSelect.value;
            const currentYear = yearSelect.value;

            const mixes = [...new Set(currentFilteredData.map(d => d.id_mix || d.mix_name).filter(Boolean))].sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
            const genres = [...new Set(currentFilteredData.map(d => d.genre).filter(Boolean))].sort();
            const years = [...new Set(currentFilteredData.map(d => d.year).filter(Boolean))].sort((a, b) => b - a);

            mixSelect.innerHTML = '<option value="">-- All sessions --</option>';
            mixes.forEach(mix => {
                const opt = document.createElement('option');
                opt.value = mix;
                opt.textContent = mix;
                if (mix === currentMix) opt.selected = true;
                mixSelect.appendChild(opt);
            });

            genreSelect.innerHTML = '<option value="">-- All genres --</option>';
            genres.forEach(genre => {
                const opt = document.createElement('option');
                opt.value = genre;
                opt.textContent = genre;
                if (genre === currentGenre) opt.selected = true;
                genreSelect.appendChild(opt);
            });

            yearSelect.innerHTML = '<option value="">-- All years --</option>';
            years.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year;
                opt.textContent = year;
                if (year === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            });
        }

        function applyFilters() {
            const searchValue = document.getElementById('search-artist').value.toLowerCase();
            const selectedMix = document.getElementById('select-mix').value;
            const selectedGenre = document.getElementById('select-genre').value;
            const selectedYear = document.getElementById('select-year').value;

            const filtered = allData.filter(item => {
                const matchesSearch = (item.artist || '').toLowerCase().includes(searchValue) ||
                                      (item.title || '').toLowerCase().includes(searchValue) ||
                                      (item.youtube_title || '').toLowerCase().includes(searchValue);

                const matchesMix = !selectedMix || item.id_mix === selectedMix || item.mix_name === selectedMix;
                const matchesGenre = !selectedGenre || item.genre === selectedGenre;
                const matchesYear = !selectedYear || item.year === selectedYear;

                return matchesSearch && matchesMix && matchesGenre && matchesYear;
            });

            const filteredByMix = allData.filter(item => {
                const s = (item.artist || '').toLowerCase().includes(searchValue) || (item.title || '').toLowerCase().includes(searchValue) || (item.youtube_title || '').toLowerCase().includes(searchValue);
                const g = !selectedGenre || item.genre === selectedGenre;
                const y = !selectedYear || item.year === selectedYear;
                return s && g && y;
            });

            const filteredByGenre = allData.filter(item => {
                const s = (item.artist || '').toLowerCase().includes(searchValue) || (item.title || '').toLowerCase().includes(searchValue) || (item.youtube_title || '').toLowerCase().includes(searchValue);
                const m = !selectedMix || item.id_mix === selectedMix || item.mix_name === selectedMix;
                const y = !selectedYear || item.year === selectedYear;
                return s && m && y;
            });

            const filteredByYear = allData.filter(item => {
                const s = (item.artist || '').toLowerCase().includes(searchValue) || (item.title || '').toLowerCase().includes(searchValue) || (item.youtube_title || '').toLowerCase().includes(searchValue);
                const m = !selectedMix || item.id_mix === selectedMix || item.mix_name === selectedMix;
                const g = !selectedGenre || item.genre === selectedGenre;
                return s && m && g;
            });

            updateSpecificSelects(filteredByMix, filteredByGenre, filteredByYear);
            renderTable(filtered);
        }

        function updateSpecificSelects(dataForMix, dataForGenre, dataForYear) {
            const mixSelect = document.getElementById('select-mix');
            const genreSelect = document.getElementById('select-genre');
            const yearSelect = document.getElementById('select-year');

            const currentMix = mixSelect.value;
            const currentGenre = genreSelect.value;
            const currentYear = yearSelect.value;

            const mixes = [...new Set(dataForMix.map(d => d.id_mix || d.mix_name).filter(Boolean))].sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
            mixSelect.innerHTML = '<option value="">-- All sessions --</option>';
            mixes.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.textContent = m;
                if (m === currentMix) opt.selected = true;
                mixSelect.appendChild(opt);
            });

            const genres = [...new Set(dataForGenre.map(d => d.genre).filter(Boolean))].sort();
            genreSelect.innerHTML = '<option value="">-- All genres --</option>';
            genres.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g; opt.textContent = g;
                if (g === currentGenre) opt.selected = true;
                genreSelect.appendChild(opt);
            });

            const years = [...new Set(dataForYear.map(d => d.year).filter(Boolean))].sort((a, b) => b - a);
            yearSelect.innerHTML = '<option value="">-- All years --</option>';
            years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y; opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            });
        }

        // Fonction de réinitialisation de tous les filtres
        function resetFilters() {
            document.getElementById('search-artist').value = '';
            document.getElementById('select-mix').value = '';
            document.getElementById('select-genre').value = '';
            document.getElementById('select-year').value = '';
            
            // Remet à jour toutes les listes et réaffiche toutes les données
            updateSelectOptions(allData);
            renderTable(allData);
        }

        function renderTable(data) {
            const tbody = document.querySelector('#catalog-table tbody');
            const countDiv = document.getElementById('record-count');
            tbody.innerHTML = '';

            countDiv.textContent = `${data.length} row(s) displayed`;

            data.forEach(item => {
                const tr = document.createElement('tr');

                let youtubeLinkHTML = '<span class="no-link">-</span>';
                if (item.url_id && item.url_id.trim() !== '') {
                    youtubeLinkHTML = `<a href="https://www.youtube.com/watch?v=${encodeURIComponent(item.url_id.trim())}" target="_blank" class="yt-link">▶ Show</a>`;
                }

                tr.innerHTML = `
                    <td><strong>${item.id_mix || ''}</strong></td>
                    <td>${item.id_title || ''}</td>
                    <td>${item.artist || ''}</td>
                    <td>${item.title || ''}</td>
                    <td>${item.mix_name || ''}</td>
                    <td>${item.genre || ''}</td>
                    <td>${item.youtube_title || ''}</td>
                    <td>${item.year || ''}</td>
                    <td>${youtubeLinkHTML}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        let sortDirection = false;
        function sortTable(columnIndex) {
            const keys = ['id_mix', 'id_title', 'artist', 'title', 'mix_name', 'genre', 'youtube_title', 'year'];
            const key = keys[columnIndex];

            sortDirection = !sortDirection;
            allData.sort((a, b) => {
                let valA = a[key] || '';
                let valB = b[key] || '';

                if (!isNaN(valA) && !isNaN(valB) && valA !== '' && valB !== '') {
                    return sortDirection ? valA - valB : valB - valA;
                }
                return sortDirection ? valA.localeCompare(valB) : valB.localeCompare(valA);
            });

            applyFilters();
        }

        window.onload = initCatalog;
    </script>
</body>
</html>
